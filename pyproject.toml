[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-clear-local"
version = "0.1.0"
description = "Preview, merge and deduplicate local CSV files with an audit report."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
csv-clear = "csv_clear:main"

[tool.setuptools]
py-modules = ["csv_clear"]
